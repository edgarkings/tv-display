<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TV Display</title>
<style>
  /* ============ EDIT HERE ============ */
  :root {
    --tv-width: 30vw;      /* size of the live TV box */
    --tv-margin: 2.5vw;    /* distance from the screen edge */
    --accent: #e11d48;     /* badge colour */
  }
  /* =================================== */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; cursor: none;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .slide { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s ease; }
  .slide.on { opacity: 1; }
  .slide img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slide .caption { position: absolute; left: 4vw; bottom: 6vh; max-width: 55vw; color: #fff;
    font-size: 4.2vw; font-weight: 800; line-height: 1.1; text-shadow: 0 .3vw 1.2vw rgba(0,0,0,.7); }
  .slide .caption small { display: block; font-size: 1.8vw; font-weight: 500; margin-top: 1vh; }
  .tv { position: absolute; right: var(--tv-margin); top: var(--tv-margin); width: var(--tv-width);
    aspect-ratio: 16 / 9; border-radius: 1vw; overflow: hidden; background: #111;
    box-shadow: 0 0 0 .3vw #fff, 0 1vw 3vw rgba(0,0,0,.6); z-index: 10; }
  .tv iframe { width: 100%; height: 100%; border: 0; pointer-events: none; }
  .badge { position: absolute; left: .8vw; top: .8vw; z-index: 11; background: var(--accent); color: #fff;
    font-size: 1vw; font-weight: 800; letter-spacing: .1em; padding: .3vw .7vw; border-radius: .4vw;
    display: flex; align-items: center; gap: .5vw; }
  .badge::before { content: ""; width: .6vw; height: .6vw; border-radius: 50%; background: #fff;
    animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .2; } }
  .clock { position: absolute; left: 4vw; top: 4vh; color: #fff; font-size: 2.4vw; font-weight: 700;
    text-shadow: 0 .2vw .8vw rgba(0,0,0,.7); z-index: 10; }
</style>
</head>
<body>
<div id="slides"></div>
<div class="clock" id="clock"></div>
<div class="tv" id="tv"><div class="badge">EN VIVO</div></div>

<script>
/* ======================= EDIT HERE ======================= */
const CONFIG = {
  secondsPerImage: 8,

  // The images that rotate on the big screen. Replace these example
  // links with your own pictures (any web link to a .jpg/.png works).
  images: [
    { src: "https://picsum.photos/seed/tv1/1920/1080", title: "¡Bienvenidos!",       subtitle: "Pregunte por nuestras ofertas de hoy" },
    { src: "https://picsum.photos/seed/tv2/1920/1080", title: "Oferta de la semana", subtitle: "Ejemplo de texto — cámbielo aquí" },
    { src: "https://picsum.photos/seed/tv3/1920/1080", title: "Síguenos en redes",   subtitle: "@sunegocio" },
    { src: "https://picsum.photos/seed/tv4/1920/1080", title: "",                    subtitle: "" },
  ],

  // Live channel in the corner. Put the YouTube CHANNEL ID of any channel
  // that streams live 24/7 (the corner shows its current live stream).
  // Example: Al Jazeera English. Set to "" to hide the box.
  youtubeChannelId: "UCNye-wNBqNL5ZzHSJj3l8Bg",
  // Or a specific live video ID instead (takes priority if filled):
  youtubeVideoId: "",

  soundOn: false,   // TVs block autoplay with sound; leave false
  showClock: true,
};
/* ========================================================= */

const slidesEl = document.getElementById("slides");
CONFIG.images.forEach((img, i) => {
  const d = document.createElement("div");
  d.className = "slide" + (i === 0 ? " on" : "");
  d.innerHTML = `<img src="${img.src}" alt="">` +
    (img.title || img.subtitle ? `<div class="caption">${img.title || ""}<small>${img.subtitle || ""}</small></div>` : "");
  slidesEl.appendChild(d);
});
let cur = 0;
const all = slidesEl.children;
if (all.length > 1) setInterval(() => {
  all[cur].classList.remove("on");
  cur = (cur + 1) % all.length;
  all[cur].classList.add("on");
}, CONFIG.secondsPerImage * 1000);

const tv = document.getElementById("tv");
const mute = CONFIG.soundOn ? 0 : 1;
const params = `autoplay=1&mute=${mute}&controls=0&playsinline=1&modestbranding=1&rel=0`;
let url = "";
if (CONFIG.youtubeVideoId) url = `https://www.youtube.com/embed/${CONFIG.youtubeVideoId}?${params}&loop=1&playlist=${CONFIG.youtubeVideoId}`;
else if (CONFIG.youtubeChannelId) url = `https://www.youtube.com/embed/live_stream?channel=${CONFIG.youtubeChannelId}&${params}`;
if (url) {
  const f = document.createElement("iframe");
  f.src = url;
  f.allow = "autoplay; encrypted-media";
  tv.appendChild(f);
  // Reload the stream every 2 hours in case it drops.
  setInterval(() => { f.src = url; }, 2 * 60 * 60 * 1000);
} else tv.style.display = "none";

const clock = document.getElementById("clock");
function tick() { clock.textContent = new Date().toLocaleTimeString("es-PR", { hour: "numeric", minute: "2-digit" }); }
if (CONFIG.showClock) { tick(); setInterval(tick, 10000); } else clock.style.display = "none";
</script>
</body>
</html>
